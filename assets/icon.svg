<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- App icon (40px and up): a green leaf (ramulus = small branch) whose midrib is a git branch, one commit on each line -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15803D"/>
      <stop offset="0.5" stop-color="#22B357"/>
      <stop offset="1" stop-color="#7BE38A"/>
    </linearGradient>
  </defs>
  <!-- Drawn along +x from the stem, then turned so the tip points up-right -->
  <g transform="translate(36 220) rotate(-45)">
    <path d="M-26 0 H8" stroke="#15803D" stroke-width="14" stroke-linecap="round"/>
    <path d="M0 0 C10 -80 170 -100 260 0 C170 100 10 80 0 0 Z" fill="url(#bg)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
      <path d="M22 0 H206"/>
      <path d="M84 0 C112 0 124 30 150 30"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="58" cy="0" r="15"/>
      <circle cx="156" cy="30" r="15"/>
    </g>
  </g>
</svg>
